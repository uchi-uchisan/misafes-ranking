<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>みさフェス 曲リクエストランキング</title>
<style>
  :root{
    --night: #e8c9a0;
    --night-deep: #ecd2ab;
    --lantern: #c9401f;
    --lantern-soft: #a8331a;
    --gold: #8a5a12;
    --paper: #ffffff;
    --ink: #2a1710;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{ background:#ecd2ab !important; color-scheme:light; }
  body{
    min-height:100vh;
    background-color:#ecd2ab !important;
    background-image:
      radial-gradient(circle at 15% 10%, rgba(232,84,42,0.16), transparent 55%),
      radial-gradient(circle at 85% 90%, rgba(138,90,18,0.14), transparent 55%);
    font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
    color:#2a1710 !important;
  }
  .wrap{ max-width:520px; margin:0 auto; padding:28px 18px 60px; }
  .eyebrow{ color:var(--gold); letter-spacing:0.3em; font-size:11px; text-align:center; margin-bottom:8px; }
  h1{ text-align:center; font-size:22px; margin-bottom:6px; }
  .sub{ text-align:center; font-size:12.5px; color:rgba(42,23,16,0.8); margin-bottom:22px; }

  .card{
    background:rgba(255,255,255,0.65);
    border:1px solid rgba(138,90,18,0.35);
    border-radius:16px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 4px 18px rgba(42,23,16,0.08);
  }
  .card h2{ font-size:14px; color:var(--gold); margin-bottom:12px; letter-spacing:0.03em; }

  .gen-toggle-row{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px; }
  .gen-toggle{
    padding:7px 13px; border-radius:999px;
    border:1px solid rgba(42,23,16,0.2);
    font-size:12px; color:rgba(42,23,16,0.78); cursor:pointer;
  }
  .gen-toggle.active{ border-color:var(--lantern); color:var(--lantern-soft); background:rgba(232,84,42,0.08); }

  .rank-item{ display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid rgba(42,23,16,0.08); }
  .rank-item:last-child{ border-bottom:none; }
  .rank-num{ width:28px; height:28px; border-radius:50%; background:rgba(138,90,18,0.12); color:var(--gold); display:flex; align-items:center; justify-content:center; font-size:12.5px; font-weight:700; flex-shrink:0; }
  .rank-num.top{ background:var(--gold); color:#fff; }
  .rank-info{ flex:1; min-width:0; }
  .rank-title{ font-size:15px; margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rank-sub{ font-size:11.5px; color:rgba(42,23,16,0.6); }
  .rank-votes{ font-size:18px; font-weight:700; color:var(--lantern-soft); flex-shrink:0; }
  .empty{ text-align:center; color:rgba(42,23,16,0.55); font-size:13px; padding:26px 0; }

  .last-updated{ text-align:center; font-size:11px; color:rgba(42,23,16,0.5); margin-top:14px; }
  .live-dot{
    display:inline-block; width:7px; height:7px; border-radius:50%;
    background:var(--lantern); margin-right:5px;
    animation: pulse 1.6s infinite;
  }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:0.3; } }

  .error-box{
    background:rgba(232,84,42,0.08);
    border:1px solid rgba(232,84,42,0.3);
    border-radius:10px;
    padding:12px 14px;
    font-size:12.5px;
    color:var(--lantern-soft);
    margin-top:10px;
    display:none;
  }
  .error-box.show{ display:block; }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">みさフェス 音楽リクエスト</div>
  <h1>曲リクエスト ランキング</h1>
  <div class="sub"><span class="live-dot"></span>会場からの投票をリアルタイムで集計中</div>

  <div class="card">
    <h2>採用ルール</h2>
    <ul style="list-style:none; display:flex; flex-direction:column; gap:8px;">
      <li style="font-size:12.5px; line-height:1.6; color:rgba(42,23,16,0.85);">🏮 得票数の<b style="color:var(--gold);">上位から</b>採用します</li>
      <li style="font-size:12.5px; line-height:1.6; color:rgba(42,23,16,0.85);">🏮 <b style="color:var(--gold);">各世代の得票1位の曲</b>も、優先的に採用します</li>
      <li style="font-size:12.5px; line-height:1.6; color:rgba(42,23,16,0.85);">🏮 表記が違うだけの同じ曲(例:順番違い・表記違い)は、<b style="color:var(--gold);">主催者の判断で合算</b>することがあります</li>
      <li style="font-size:12.5px; line-height:1.6; color:rgba(42,23,16,0.85);">🏮 当日の選曲・BGMとのバランスを見ながら、担当者が調整して流します</li>
    </ul>
  </div>

  <div class="card">
    <h2 style="margin-bottom:4px;">ランキング</h2>
    <div style="font-size:11.5px; color:rgba(42,23,16,0.55); margin-bottom:12px;">「アーティスト名 曲名」の形で入力してください。全角・半角の違いは自動で吸収されます</div>
    <div class="gen-toggle-row" id="gen-toggle-row"></div>
    <div id="rank-list"><div class="empty">読み込み中...</div></div>
    <div class="last-updated" id="last-updated"></div>
    <div class="error-box" id="error-box"></div>
  </div>
</div>

<script>
// ▼▼▼ 実際に使う際は、ここをGoogleフォームの回答スプレッドシートを
//     「ウェブに公開」した際に発行されるCSVのURLに差し替えてください ▼▼▼
const CSV_URL = "https://docs.google.com/spreadsheets/d/1SsjanvxSB2IIjllQ99ZYf0oDFttxYy0rwTInWvn9ubI/gviz/tq?tqx=out:csv";
const COL_GEN = 1;   // 年代が入っている列(A列=0, B列=1, C列=2...)
const COL_SONG = 2;  // 曲名が入っている列
// ▲▲▲ ここまで ▲▲▲

const GENERATIONS = ["小学生以下","10代","20〜30代","40〜50代","60代以上"];
let currentFilter = "全体";
let songs = {};

const rankList = document.getElementById('rank-list');
const lastUpdated = document.getElementById('last-updated');
const genToggleRow = document.getElementById('gen-toggle-row');
const errorBox = document.getElementById('error-box');

['全体', ...GENERATIONS].forEach(g => {
  const el = document.createElement('div');
  el.className = 'gen-toggle' + (g === '全体' ? ' active' : '');
  el.textContent = g;
  el.addEventListener('click', () => {
    currentFilter = g;
    document.querySelectorAll('.gen-toggle').forEach(o => o.classList.remove('active'));
    el.classList.add('active');
    renderRanking();
  });
  genToggleRow.appendChild(el);
});

function normalizeKey(name){
  return name
    .normalize('NFKC') // 全角/半角の英数字・カタカナの違いを自動で統一
    .trim()
    .toLowerCase()
    .replace(/[\s\-–—・/／,、。.!?!?()（）「」『』]+/g, '');
}

function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; } else { inQuotes = false; }
      } else { field += c; }
    } else {
      if(c === '"'){ inQuotes = true; }
      else if(c === ','){ row.push(field); field = ''; }
      else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
      else if(c === '\r'){ /* skip */ }
      else { field += c; }
    }
  }
  if(field.length > 0 || row.length > 0){ row.push(field); rows.push(row); }
  return rows;
}

async function fetchAndTally(){
  try{
    const res = await fetch(CSV_URL, { cache: 'no-store' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    const rows = parseCSV(text);

    const newSongs = {};
    for(let i = 1; i < rows.length; i++){
      const row = rows[i];
      if(!row || row.length === 0) continue;
      const gen = (row[COL_GEN] || '').trim();
      const songName = (row[COL_SONG] || '').trim();
      if(!songName) continue;
      const key = normalizeKey(songName);
      if(!newSongs[key]){ newSongs[key] = { name: songName, total: 0, byGen: {} }; }
      newSongs[key].total += 1;
      if(gen){ newSongs[key].byGen[gen] = (newSongs[key].byGen[gen] || 0) + 1; }
    }
    songs = newSongs;
    errorBox.classList.remove('show');
    lastUpdated.textContent = '最終更新: ' + new Date().toLocaleTimeString('ja-JP');
    renderRanking();
  }catch(err){
    errorBox.textContent = '読み込みに失敗しました(' + err.message + ')。CSVのURLを確認してください';
    errorBox.classList.add('show');
  }
}

function renderRanking(){
  let entries = Object.values(songs);
  if(currentFilter !== '全体'){
    entries = entries
      .map(s => ({ ...s, filteredCount: s.byGen[currentFilter] || 0 }))
      .filter(s => s.filteredCount > 0)
      .sort((a, b) => b.filteredCount - a.filteredCount);
  }else{
    entries = entries.slice().sort((a, b) => b.total - a.total);
  }

  if(entries.length === 0){
    rankList.innerHTML = '<div class="empty">まだ投票がありません</div>';
    return;
  }

  rankList.innerHTML = '';
  entries.slice(0, 30).forEach((s, i) => {
    const count = currentFilter === '全体' ? s.total : s.filteredCount;
    const genBreakdown = Object.entries(s.byGen)
      .sort((a,b) => b[1]-a[1])
      .map(([g,c]) => `${g}:${c}`).join(' / ');
    const row = document.createElement('div');
    row.className = 'rank-item';
    row.innerHTML = `
      <div class="rank-num ${i < 3 ? 'top' : ''}">${i+1}</div>
      <div class="rank-info">
        <div class="rank-title">${escapeHtml(s.name)}</div>
        <div class="rank-sub">${escapeHtml(genBreakdown)}</div>
      </div>
      <div class="rank-votes">${count}</div>
    `;
    rankList.appendChild(row);
  });
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

fetchAndTally();
setInterval(fetchAndTally, 15000);
</script>
</body>
</html>
